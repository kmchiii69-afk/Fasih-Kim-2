<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Booked Calls · GOH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0906; --panel:#1a1610; --panel-alt:#0f0d09;
    --txt:#f4ede0; --muted:#a89a80; --muted2:#6b5f4a;
    --gold:#d8a94f; --gold-lite:#f0c968; --gold-dark:#a37a2e;
    --grad-gold:linear-gradient(135deg,#d8a94f 0%,#f0c968 45%,#a37a2e 100%);
    --border:#352a1e;
    --green:#4ade80; --red:#f87171;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:'Poppins',sans-serif;font-weight:400;line-height:1.5;min-height:100vh}
  .wrap{max-width:1400px;margin:0 auto;padding:32px 24px}
  .hero{padding-bottom:20px;border-bottom:1px solid var(--border);display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
  h1{font-size:30px;font-weight:800;letter-spacing:-.5px}
  h1 .gold{background:var(--grad-gold);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .subline{color:var(--muted);font-size:13px;margin-top:6px;letter-spacing:.3px}
  .controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .controls input[type="date"],.controls input[type="month"]{background:var(--panel-alt);color:var(--txt);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:13px;font-family:inherit;color-scheme:dark}
  .mode-toggle{display:inline-flex;background:var(--panel-alt);border:1px solid var(--border);border-radius:8px;padding:2px}
  .mode-toggle button{background:transparent;color:var(--muted);border:none;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;border-radius:6px;letter-spacing:.3px;transition:all .15s}
  .mode-toggle button:hover{color:var(--txt)}
  .mode-toggle button.active{background:rgba(216,169,79,.15);color:var(--gold)}
  .refresh-btn{background:var(--panel-alt);color:var(--txt);border:1px solid var(--border);border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px}
  .refresh-btn:hover{border-color:rgba(216,169,79,.55);color:var(--gold)}
  .refresh-btn.syncing{opacity:.5;pointer-events:none}
  .status{color:var(--muted2);font-size:11.5px;letter-spacing:.4px;text-transform:uppercase;font-weight:500}
  .status .live-dot{display:inline-block;width:6px;height:6px;background:var(--green);border-radius:50%;margin-right:5px;vertical-align:middle;box-shadow:0 0 6px var(--green)}
  .summary{display:flex;gap:16px;margin-top:22px;flex-wrap:wrap}
  .stat{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 18px;min-width:120px}
  .stat .label{font-size:10.5px;color:var(--muted2);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
  .stat .val{font-size:24px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
  .stat.qualified .val{color:var(--green)}
  .stat.disqualified .val{color:var(--red)}
  .stat.pending .val{color:var(--gold)}
  .table-wrap{background:var(--panel);border:1px solid var(--border);border-radius:12px;margin-top:22px;overflow:hidden}
  table{width:100%;border-collapse:collapse;font-size:13px}
  thead{background:var(--panel-alt)}
  th{text-align:left;font-weight:600;color:var(--muted);padding:12px 12px;border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:.4px;font-size:10.5px;white-space:nowrap}
  td{padding:12px 12px;border-bottom:1px solid #221c14;vertical-align:middle}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:rgba(216,169,79,.03)}
  .time{color:var(--gold);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
  .name{font-weight:600;color:var(--txt)}
  .contact{color:var(--muted);font-size:12.5px}
  .contact a{color:var(--gold);text-decoration:none;transition:color .15s}
  .contact a:hover{color:var(--gold-lite);text-decoration:underline}
  .revenue{font-variant-numeric:tabular-nums}
  select.source-sel,input.notes-in{background:var(--panel-alt);color:var(--txt);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:12px;font-family:inherit;width:100%;box-sizing:border-box}
  select.source-sel:focus,input.notes-in:focus{outline:none;border-color:rgba(216,169,79,.55)}
  input.notes-in{min-width:160px}
  .qualified-toggle{display:inline-flex;gap:4px}
  .qtbtn{background:var(--panel-alt);color:var(--muted);border:1px solid var(--border);border-radius:6px;padding:5px 10px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;letter-spacing:.3px;transition:all .15s}
  .qtbtn:hover{color:var(--txt);border-color:rgba(216,169,79,.4)}
  .qtbtn.active-yes{background:rgba(74,222,128,.16);color:var(--green);border-color:rgba(74,222,128,.35)}
  .qtbtn.active-no{background:rgba(248,113,113,.16);color:var(--red);border-color:rgba(248,113,113,.35)}
  .empty{padding:60px 20px;text-align:center;color:var(--muted2);font-size:14px}
  .empty .gold-text{color:var(--gold);font-weight:600;margin-bottom:6px;font-size:15px}
  .save-flash{position:fixed;top:16px;right:16px;background:rgba(74,222,128,.16);color:var(--green);border:1px solid rgba(74,222,128,.35);border-radius:8px;padding:8px 14px;font-size:12px;letter-spacing:.3px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:100}
  .save-flash.show{opacity:1}
  .save-flash.err{background:rgba(248,113,113,.16);color:var(--red);border-color:rgba(248,113,113,.35)}
  @media (max-width:900px){
    .wrap{padding:20px 12px}
    .hero{flex-direction:column;align-items:flex-start}
    table{font-size:12px}
    th,td{padding:9px 8px}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div>
      <h1>Booked <span class="gold">Calls</span></h1>
      <div class="subline">Calls booked on this date · edit qualification and source inline</div>
    </div>
    <div class="controls">
      <div class="mode-toggle" id="modeToggle">
        <button data-mode="day" class="active">Day</button>
        <button data-mode="month">Month</button>
      </div>
      <input type="date" id="dateInput">
      <input type="month" id="monthInput" style="display:none">
      <button class="refresh-btn" id="refreshBtn">↻ Refresh</button>
      <span class="status" id="status"><span class="live-dot"></span>Auto-refresh 60s</span>
    </div>
  </div>

  <div class="summary" id="summary"></div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Call Date/Time</th>
          <th>Name</th>
          <th>Email</th>
          <th>Instagram</th>
          <th>Phone</th>
          <th>Revenue</th>
          <th>Source</th>
          <th>Qualified?</th>
          <th>Notes</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<div class="save-flash" id="saveFlash">Saved</div>

<script>
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  // Source dropdown options — the specific UTM sources you track. Any value
  // from Calendly's utm_source not in this list is preserved and shown as-is
  // (so if a booking comes in with utm_source=facebook, "facebook" appears in
  // the dropdown for that row without erasing your preset list).
  const SOURCE_OPTIONS = ["youtube", "tom", "ayoub", "instagram", "ads", "referral", "direct"];

  function todayUK() {
    const parts = new Intl.DateTimeFormat("en-GB", {
      timeZone: "Europe/London",
      year: "numeric", month: "2-digit", day: "2-digit",
    }).formatToParts(new Date()).reduce((o, p) => (o[p.type] = p.value, o), {});
    return `${parts.year}-${parts.month}-${parts.day}`;
  }

  function flash(msg, isErr) {
    const f = $("saveFlash");
    f.textContent = msg;
    f.classList.toggle("err", !!isErr);
    f.classList.add("show");
    setTimeout(() => f.classList.remove("show"), 1500);
  }

  // Format "YYYY-MM-DD HH:mm" as "12 Aug · 14:30" for compact display in the table.
  // We show BOTH the date and time in the call column because you're now
  // filtering by BOOKING date, so a call could be days or weeks in the future.
  function fmtCallDT(dt) {
    const s = String(dt || "").trim();
    if (!s) return "—";
    const m = s.match(/^(\d{4})-(\d{2})-(\d{2})\s+(\d{2}:\d{2})/);
    if (!m) return s;
    const [, y, mo, d, hm] = m;
    const dateObj = new Date(+y, +mo - 1, +d);
    const monthLbl = dateObj.toLocaleDateString("en-GB", { month: "short" });
    return `${+d} ${monthLbl} · ${hm}`;
  }

  // Instagram handles may be with or without "@" — display clean, link to profile.
  function igLink(handle) {
    const h = String(handle || "").trim();
    if (!h) return '<span style="color:var(--muted2)">—</span>';
    const clean = h.replace(/^@/, "").split(/[/?]/)[0];
    if (!clean) return '<span style="color:var(--muted2)">—</span>';
    return `<a href="https://instagram.com/${encodeURIComponent(clean)}" target="_blank" rel="noopener">@${esc(clean)}</a>`;
  }
  function telLink(phone) {
    // Defensive — Calendly phone_number answers can occasionally arrive as
    // objects or nulls; String() coerces everything safely.
    const p = String(phone || "").trim();
    if (!p) return '<span style="color:var(--muted2)">—</span>';
    const clean = p.replace(/[^\d+]/g, "");
    if (!clean) return `<span>${esc(p)}</span>`;
    return `<a href="tel:${esc(clean)}">${esc(p)}</a>`;
  }
  function mailLink(email) {
    const e = String(email || "").trim();
    if (!e) return "";
    return `<a href="mailto:${esc(e)}">${esc(e)}</a>`;
  }

  function sourceSelect(current, calendlyId) {
    // Include the current value in options even if it's not in SOURCE_OPTIONS
    // — Calendly can pass any UTM value, not just our preset list.
    const opts = [...SOURCE_OPTIONS];
    if (current && !opts.includes(current)) opts.unshift(current);
    return `<select class="source-sel" data-id="${esc(calendlyId)}" data-field="source">
      ${opts.map(o => `<option value="${esc(o)}"${o === current ? " selected" : ""}>${esc(o)}</option>`).join("")}
    </select>`;
  }
  function qualifiedButtons(current, calendlyId) {
    const cur = String(current || "").toLowerCase().trim();
    return `<div class="qualified-toggle" data-id="${esc(calendlyId)}">
      <button class="qtbtn${cur === "yes" ? " active-yes" : ""}" data-val="yes">Yes</button>
      <button class="qtbtn${cur === "no" ? " active-no" : ""}" data-val="no">No</button>
    </div>`;
  }
  function notesInput(current, calendlyId) {
    return `<input type="text" class="notes-in" data-id="${esc(calendlyId)}" data-field="notes" value="${esc(current || "")}" placeholder="Add note…">`;
  }

  function renderSummary(rows) {
    const total = rows.length;
    const q = rows.filter(r => String(r.Qualified || "").toLowerCase() === "yes").length;
    const d = rows.filter(r => String(r.Qualified || "").toLowerCase() === "no").length;
    const p = total - q - d;
    $("summary").innerHTML = `
      <div class="stat"><div class="label">Total</div><div class="val">${total}</div></div>
      <div class="stat qualified"><div class="label">Qualified</div><div class="val">${q}</div></div>
      <div class="stat disqualified"><div class="label">Disqualified</div><div class="val">${d}</div></div>
      <div class="stat pending"><div class="label">Pending</div><div class="val">${p}</div></div>
    `;
  }

  function renderRows(rows) {
    const tbody = $("tbody");
    if (!rows.length) {
      tbody.innerHTML = `<tr><td colspan="9"><div class="empty"><div class="gold-text">No calls booked</div>Nothing was booked in ${esc(currentLabel())}. New bookings will appear here automatically.</div></td></tr>`;
      return;
    }
    tbody.innerHTML = rows.map(r => {
      const id = r["Calendly ID"] || "";
      return `<tr>
        <td class="time">${esc(fmtCallDT(r["Call Time"]))}</td>
        <td class="name">${esc(r.Name)}</td>
        <td class="contact">${mailLink(r.Email)}</td>
        <td class="contact">${igLink(r.Instagram)}</td>
        <td class="contact">${telLink(r.Phone)}</td>
        <td class="revenue">${esc(r["Current Revenue"] || "—")}</td>
        <td>${sourceSelect(r.Source || "direct", id)}</td>
        <td>${qualifiedButtons(r.Qualified, id)}</td>
        <td>${notesInput(r.Notes, id)}</td>
      </tr>`;
    }).join("");
    wireRowHandlers();
  }

  // Wire up inline edits — every change POSTs to /api/booked-calls-update.
  // Optimistic UI: the value's already visible; if the POST fails we flash red.
  function wireRowHandlers() {
    document.querySelectorAll(".source-sel").forEach(sel => {
      sel.onchange = () => saveField(sel.dataset.id, "source", sel.value);
    });
    document.querySelectorAll(".notes-in").forEach(inp => {
      // Save on blur — avoids one API call per keystroke.
      inp.onblur = () => saveField(inp.dataset.id, "notes", inp.value);
      inp.onkeydown = e => { if (e.key === "Enter") inp.blur(); };
    });
    document.querySelectorAll(".qualified-toggle .qtbtn").forEach(btn => {
      btn.onclick = () => {
        const grp = btn.parentElement;
        const id = grp.dataset.id;
        const val = btn.dataset.val;
        // Toggle: clicking the same choice again clears it (back to pending)
        const alreadyActive = btn.classList.contains("active-" + val);
        const finalVal = alreadyActive ? "" : val;
        // Update UI immediately
        grp.querySelectorAll(".qtbtn").forEach(b => b.classList.remove("active-yes", "active-no"));
        if (finalVal) btn.classList.add("active-" + finalVal);
        saveField(id, "qualified", finalVal).then(() => {
          // Refresh summary counts without re-fetching everything
          const rows = [...document.querySelectorAll("tbody tr")].map(tr => {
            const q = tr.querySelector(".qtbtn.active-yes") ? "yes" : (tr.querySelector(".qtbtn.active-no") ? "no" : "");
            return { Qualified: q };
          });
          renderSummary(rows);
        });
      };
    });
  }

  async function saveField(calendlyId, field, value) {
    try {
      const r = await fetch("/api/booked-calls-update", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ calendlyId, [field]: value }),
      });
      const j = await r.json();
      if (!r.ok || j.error) throw new Error(j.error || "HTTP " + r.status);
      flash("✓ Saved");
    } catch (e) {
      flash("Save failed: " + (e.message || e), true);
    }
  }

  let mode = "day"; // "day" | "month"
  let loading = false;

  // Build the API URL based on the current mode + picker value.
  function buildLoadUrl() {
    if (mode === "month") {
      const v = $("monthInput").value; // "YYYY-MM"
      return "/api/booked-calls-read?month=" + encodeURIComponent(v);
    }
    return "/api/booked-calls-read?date=" + encodeURIComponent($("dateInput").value);
  }

  // Human-readable label of the current filter, used in the empty state message.
  function currentLabel() {
    if (mode === "month") {
      const v = $("monthInput").value;
      if (!v) return "this month";
      const [y, m] = v.split("-");
      return new Date(+y, +m - 1, 1).toLocaleDateString("en-GB", { month: "long", year: "numeric" });
    }
    return $("dateInput").value;
  }

  async function load() {
    if (loading) return;
    loading = true;
    $("refreshBtn").classList.add("syncing");
    try {
      const r = await fetch(buildLoadUrl());
      const j = await r.json();
      if (!r.ok || j.error) throw new Error(j.error || "HTTP " + r.status);
      renderSummary(j.rows || []);
      renderRows(j.rows || []);
    } catch (e) {
      $("tbody").innerHTML = `<tr><td colspan="9"><div class="empty"><div class="gold-text">Couldn't load calls</div>${esc(e.message || e)}</div></td></tr>`;
    } finally {
      loading = false;
      $("refreshBtn").classList.remove("syncing");
    }
  }

  // Toggle handler — swap the picker and reload.
  function setMode(newMode) {
    if (mode === newMode) return;
    mode = newMode;
    document.querySelectorAll("#modeToggle button").forEach(b => b.classList.toggle("active", b.dataset.mode === newMode));
    $("dateInput").style.display = newMode === "day" ? "" : "none";
    $("monthInput").style.display = newMode === "month" ? "" : "none";
    load();
  }
  document.querySelectorAll("#modeToggle button").forEach(b => {
    b.onclick = () => setMode(b.dataset.mode);
  });

  // Default values — today for the day picker, current month for month picker.
  $("dateInput").value = todayUK();
  $("monthInput").value = todayUK().slice(0, 7);
  $("dateInput").addEventListener("change", load);
  $("monthInput").addEventListener("change", load);
  $("refreshBtn").addEventListener("click", load);
  load();
  // Auto-refresh every 60s so bookings appear without needing manual refresh.
  // Only refreshes if the page is currently visible — no wasted calls when tab is backgrounded.
  setInterval(() => { if (document.visibilityState === "visible") load(); }, 60_000);
</script>
</body>
</html>
